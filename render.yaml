# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Needs a paid instance type (Render only attaches persistent disks to paid services).
services:
  - type: web
    name: fdrhs-robotics-hub
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: hub-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SEED_SCENARIO
        value: clean
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: coach
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: TEAM_JOIN_CODE
        sync: false
      # AI: fill in Azure OpenAI and/or OpenAI. Leave all blank to run the built-in demo mentor.
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-5.4-nano
      - key: AZURE_OPENAI_FALLBACK_DEPLOYMENT
        value: gpt-5-nano
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-nano
